<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0a1224" />
      <stop offset="80%" stop-color="#0f1b36" />
      <stop offset="100%" stop-color="#091022" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes streamMotion {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-element { animation: floatSlow 5s ease-in-out infinite; }
      .pulsing-element { animation: pulseGlow 3.5s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 6 6; animation: streamMotion 12s linear infinite; }
      .beacon { transform-origin: center; animation: beaconSpin 18s linear infinite; }
    </style>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing-element" />
  <circle cx="1060" cy="270" r="140" fill="#818cf8" opacity="0.14" filter="url(#glow)" class="pulsing-element" />
  <circle cx="980" cy="70" r="100" fill="#10b981" opacity="0.10" filter="url(#glow)" />

  <!-- Dynamic Animated Audit Chain Paths in background -->
  <g opacity="0.45">
    <path d="M 80 290 Q 240 230, 400 280 T 720 270 T 1120 290" fill="none" stroke="#00f2fe" stroke-width="1.8" class="stream-line" />
    <path d="M 120 90 Q 300 130, 500 80 T 880 110 T 1140 70" fill="none" stroke="#6366f1" stroke-width="1.5" class="stream-line" />
  </g>

  <!-- Decorative Cryptographic Hash Blocks in Background (Sides) -->
  <g class="floating-element" opacity="0.55">
    <!-- Block 1 -->
    <rect x="50" y="140" width="115" height="48" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#00f2fe">HASH BLOCK #01</text>
    <text x="65" y="177" font-family="Courier, monospace" font-size="8.5" fill="#94a3b8">SHA256: 9e7f..3d1a</text>

    <!-- Block 2 -->
    <rect x="1035" y="130" width="120" height="48" rx="8" fill="url(#card-grad)" stroke="#10b981" stroke-width="1" />
    <text x="1048" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">VERIFIED MERKLE</text>
    <text x="1048" y="167" font-family="Courier, monospace" font-size="8.5" fill="#94a3b8">Ed25519: valid ✓</text>
  </g>

  <!-- Central Foreground Content Container (guaranteed on top) -->
  <g id="foreground-content">
    <!-- Category Pill / Badge -->
    <g transform="translate(600, 56)">
      <rect x="-175" y="-14" width="350" height="28" rx="14" fill="#0f172a" stroke="url(#accent-cyan)" stroke-width="1.5" />
      <circle cx="-150" cy="0" r="4.5" fill="#00f2fe">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-135" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">
        TAMPER-EVIDENT AI AUDIT LOGS &amp; GOVERNANCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome Automated AI Audit Log Generators
    </text>

    <!-- Subtitle -->
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#93c5fd">
      Cryptographic Proofs • Agent Decision Tracing • Regulatory Compliance Evidence
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(600, 240)">
      <!-- Pill 1: EU AI Act -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#38bdf8" />
        <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">EU AI Act (Art. 12)</text>
      </g>

      <!-- Pill 2: ISO 42001 & NIST -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#a855f7" />
        <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">ISO 42001 &amp; NIST</text>
      </g>

      <!-- Pill 3: Ed25519 & Hash Chains -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#10b981" />
        <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Ed25519 Signed Logs</text>
      </g>

      <!-- Pill 4: Agent Observability -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="17" r="4" fill="#f59e0b" />
        <text x="34" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Agent Step Tracing</text>
      </g>
    </g>

    <!-- Bottom Verifiable Ledger Bar -->
    <g transform="translate(600, 316)">
      <line x1="-380" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" opacity="0.7" />
      <text x="0" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#64748b" letter-spacing="1">
        GENESIS_BLOCK: SHA256[ROOT] ➔ CONTINUOUS_AUDIT ➔ INDEPENDENT_VERIFICATION_READY
      </text>
    </g>
  </g>

  <!-- Border accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#accent-cyan)" stroke-width="1.2" opacity="0.4" />
</svg>
